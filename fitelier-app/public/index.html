<script>
/* Keep mobile navigation and calls to action typographically clean. */
(() => {
  const mobile = window.matchMedia('(max-width: 767px)');
  const arrows = /[↗↖↘↙→←↑↓➡⬅➜➔➝➞➤➳➙]/g;
  const originals = new Map();
  let queued = false;
  const observer = new MutationObserver(schedule);
  function update() {
    observer.disconnect();
    if (mobile.matches) {
      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (!node.parentElement || node.parentElement.closest('script,style')) continue;
        if (!arrows.test(node.nodeValue)) { arrows.lastIndex = 0; continue; }
        arrows.lastIndex = 0;
        if (!originals.has(node)) originals.set(node, node.nodeValue);
        const parent = node.parentElement;
        if (parent.matches('[data-month="-1"]')) node.nodeValue = '‹';
        else if (parent.matches('[data-month="1"]')) node.nodeValue = '›';
        else node.nodeValue = node.nodeValue.replace(arrows, '').replace(/\s+$/, '');
      }
    } else {
      for (const [node, value] of originals) if (node.isConnected) node.nodeValue = value;
      originals.clear();
    }
    observer.observe(document.body, { childList: true, subtree: true, characterData: true });
  }
  function schedule() {
    if (queued) return;
    queued = true;
    queueMicrotask(() => { queued = false; update(); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', update, { once: true });
  else update();
  mobile.addEventListener('change', schedule);
})();
</script>
<script id="fitelier-about-name-motion">
(() => {
  const clamp = n => Math.max(0, Math.min(1, n));
  const ease = n => n*n*(3-2*n);
  let pending = false;
  function update() {
    pending = false;
    const track = document.getElementById('about-name-track');
    if (!track) return;
    const f = track.querySelector('.about-name-f');
    const i = track.querySelector('.about-name-i');
    const a = track.querySelector('.about-name-a');
    const rest = track.querySelector('.about-name-rest');
    if (!f || !i || !a || !rest) return;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const rect = track.getBoundingClientRect();
    const p = reduce ? 1 : clamp(-rect.top / Math.max(1, rect.height - innerHeight));
    const shift = ease(clamp((p - .18) / .68));
    const finish = ease(clamp((p - .62) / .38));
    const dot = i.querySelector('.about-name-i-dot');
    const stem = i.querySelector('.about-name-i-stem');
    // Clockwise F rotation; the i's stem leans into the open counterform.
    f.setAttribute('transform', 'translate(' + (13*shift) + ' ' + (-4*shift) + ') rotate(' + (27*shift) + ' 151 82)');
    i.setAttribute('transform', 'translate(' + (-12*shift) + ' ' + (-5*shift) + ')');
    if (stem) stem.setAttribute('transform', 'rotate(' + (-28*finish) + ' 190 113) translate(' + (-4*finish) + ' 0)');
    // The dot tucks down and inward, disappearing into the junction, not hovering above.
    if (dot) {
      dot.setAttribute('transform', 'translate(' + (-15*finish) + ' ' + (31*finish) + ')');
      dot.style.opacity = String(1 - ease(clamp((p - .83) / .16)));
    }
    f.style.fill = p > .13 ? '#9a7450' : '#463a2f';
    i.style.color = p > .13 ? '#9a7450' : '#463a2f';
    // Retain the constructed letterforms until the final moments, then settle
    // into the clean, legible A without disturbing the rest of the word.
    const settle = ease(clamp((p - .90) / .10));
    f.style.opacity = i.style.opacity = String(1 - settle);
    a.style.opacity = String(settle);
    // Preserve the exact position and spacing of 'telier' throughout.
    rest.removeAttribute('transform');
    track.setAttribute('data-complete', p >= .995 ? 'true' : 'false');
  }
  function schedule() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(update);
  }
  addEventListener('scroll', schedule, { passive: true });
  addEventListener('resize', schedule, { passive: true });
  addEventListener('hashchange', () => { schedule(); requestAnimationFrame(schedule); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', schedule, { once: true });
  else schedule();
})();
</script>
